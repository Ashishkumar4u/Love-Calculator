<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-r from-pink-500 via-red-500 to-purple-500 text-white text-center min-h-screen flex flex-col justify-between">
    <header class="py-6 text-4xl font-bold neon-text">Love Calculator ❤️</header>
    <main class="flex-1 p-10 flex justify-center items-center">
        <div class="bg-white bg-opacity-10 text-white rounded-xl shadow-lg p-8 w-full max-w-md">
            <h2 class="text-2xl font-semibold mb-6">Find Your Love Percentage</h2>
            <input type="text" id="name1" placeholder="Your Name" class="w-full p-3 rounded-md border border-gray-300 mb-4 text-black focus:outline-none focus:ring-2 focus:ring-pink-300">
            <input type="text" id="name2" placeholder="Your Partner's Name" class="w-full p-3 rounded-md border border-gray-300 mb-6 text-black focus:outline-none focus:ring-2 focus:ring-pink-300">
            <button onclick="calculateLove()" class="bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 px-6 rounded-md transition duration-300 w-full">Calculate Love ❤️</button>
            <div id="result" class="mt-8 text-xl font-bold"></div>
        </div>
    </main>
    <footer class="py-4 text-lg font-medium bg-black bg-opacity-50">Create ❤️ by Ashish_kumar.</footer>
    <script src="script.js"></script>
</body>

</html>
